name: Build release artifacts
on:
  workflow_dispatch:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - run: python -m pip install build twine
      - run: python -m unittest discover -s tests -v
      - run: python scripts/generate_cli_docs.py --check
      - run: python scripts/check_docs.py
      - run: python -m build
      - run: python -m twine check dist/*.whl dist/*.tar.gz
      - run: python scripts/build_pyz.py
      - run: python -I alignview.pyz --demo --no-menu
      - run: python -I alignview.pyz --lang en --docs quickstart
      - run: python scripts/build_portable.py
      - run: python scripts/checksums.py
      - uses: actions/upload-artifact@v7
        with:
          name: alignview-release
          if-no-files-found: error
          path: |
            dist/*.whl
            dist/*.tar.gz
            dist/*-portable.zip
            dist/SHA256SUMS
            alignview.pyz
