name: Build and verify release artifacts
on:
  workflow_dispatch:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - run: python -m pip install 'setuptools>=77' wheel build twine
      - run: python scripts/build_release.py
      - uses: actions/upload-artifact@v7
        with:
          name: alignview-release
          if-no-files-found: error
          path: |
            dist/*.whl
            dist/*.tar.gz
            dist/*.pyz
            dist/*-portable.zip
            dist/SHA256SUMS
