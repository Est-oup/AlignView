name: Tests AlignView
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install .
      - run: python -m unittest discover -s tests -v
      - run: python scripts/build_pyz.py
      - run: python alignview.pyz --version
      - run: python -I alignview.pyz --demo --no-menu
      - run: alignview --help
      - run: alignview --demo --no-menu
